name: Update Public Repository List

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Update repository list in README
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.repo.owner;
            const { data: repos } = await github.rest.repos.listForUser({
              username,
              type: "owner",
              sort: "updated",
              direction: "desc",
              per_page: 100
            });

            const rows = repos
              .filter(repo => !repo.fork)
              .map(repo => {
                const name = repo.name.replace(/\|/g, "\\|");
                const description = (repo.description || "No description provided.")
                  .replace(/\|/g, "\\|")
                  .replace(/\r?\n/g, " ");
                const language = repo.language || "—";
                return `| [${name}](${repo.html_url}) | ${description} | ${language} | ${repo.stargazers_count} |`;
              });

            const start = "<!-- REPOSITORY-LIST:START -->";
            const end = "<!-- REPOSITORY-LIST:END -->";
            const body = [
              start,
              "_This list is updated automatically by GitHub Actions._",
              "",
              "| Repository | Description | Language | Stars |",
              "|---|---|---|---:|",
              ...(rows.length ? rows : ["| No public repositories found | — | — | 0 |"]),
              end
            ].join("\n");

            const fs = require("fs");
            const path = "README.md";
            const readme = fs.readFileSync(path, "utf8");
            const updated = readme.replace(
              new RegExp(`${start}[\\s\\S]*?${end}`),
              body
            );
            if (updated === readme) {
              core.setFailed("Repository list markers were not found in README.md");
              return;
            }
            fs.writeFileSync(path, updated);

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update public repository list"
          git push
